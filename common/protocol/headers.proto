syntax = "proto3";

package xray.common.protocol;
option csharp_namespace = "Xray.Common.Protocol";
option go_package = "github.com/GFW-knocker/Xray-core/common/protocol";
option java_package = "com.xray.common.protocol";
option java_multiple_files = true;

enum SecurityType {
  UNKNOWN = 0;
  AUTO = 2;
  AES128_GCM = 3;
  CHACHA20_POLY1305 = 4;
  // GFW-knocker: upstream dropped NONE; the revived QUIC transport uses it to mean
  // "no AEAD". Number 6 (ZERO) is intentionally left unused.
  NONE = 5;
}

message SecurityConfig {
  SecurityType type = 1;
}
