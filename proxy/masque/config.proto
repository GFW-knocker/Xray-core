syntax = "proto3";

package xray.proxy.masque;
option csharp_namespace = "Xray.Proxy.Masque";
option go_package = "github.com/GFW-knocker/Xray-core/proxy/masque";
option java_package = "com.xray.proxy.masque";
option java_multiple_files = true;

// Config is an outbound that carries traffic over MASQUE, an IP tunnel built on
// HTTP extended CONNECT (RFC 9220) with the packets themselves in HTTP
// datagrams (RFC 9297) or DATAGRAM capsules (RFC 9484).
//
// Only what MASQUE itself needs lives here. The TLS of the connection
// underneath, which is server name, ECH, certificate pinning and fingerprint,
// comes from streamSettings the way it does for every other outbound, and the
// socket options, dialerProxy chaining and udpmasks come from there too.
message Config {
  enum DomainStrategy {
    FORCE_IP = 0;
    FORCE_IP4 = 1;
    FORCE_IP6 = 2;
    FORCE_IP46 = 3;
    FORCE_IP64 = 4;
  }

  enum Transport {
    // Extended CONNECT over HTTP/3, packets in QUIC datagrams. The default.
    H3 = 0;
    // Extended CONNECT over HTTP/2, packets as DATAGRAM capsules on the request
    // stream. For paths where UDP is unusable; TCP underneath means head-of-line
    // blocking.
    H2 = 1;
  }

  // The edge to reach, as "host:port".
  string endpoint = 1;

  // The addresses the tunnel holds locally, in CIDR or bare form. When empty the
  // address the edge assigns over the tunnel is used instead.
  repeated string address = 2;

  // PKCS#8 PEM of the P-256 private key enrolled with the edge. The edge
  // authorises by the public key registered against the account, so there is no
  // certificate authority anywhere in this.
  string private_key = 3;

  // PEM of the self-signed certificate carrying that key. Regenerated from
  // private_key when empty, which is the normal case.
  string certificate = 4;

  Transport transport = 5;

  // The :authority of the CONNECT request. On the HTTP/2 carrier a port is
  // added when this names none, since an ordinary CONNECT addresses a host and
  // a port.
  string authority = 6;

  // The :path of the CONNECT request. HTTP/3 only: the HTTP/2 carrier sends an
  // ordinary CONNECT, which has nowhere to put one.
  string path = 7;

  // How the tunnel protocol is named. Cloudflare's edge wants "cf-connect-ip"
  // rather than RFC 9484's "connect-ip".
  //
  // Where it is carried differs by transport, which is the edge's doing rather
  // than a choice: HTTP/3 takes it as the :protocol of an extended CONNECT,
  // HTTP/2 as a "cf-connect-proto" header on an ordinary one.
  string connect_protocol = 8;

  int32 mtu = 9;

  // Resolvers to use through the tunnel, matching the WireGuard outbound's
  // remoteDNS.
  repeated string DNS = 10;
  DomainStrategy domain_strategy = 11;

  // Hex SHA-256 of the SubjectPublicKeyInfo of the edge certificates to accept.
  //
  // The edge cannot be verified the ordinary way: it serves a different
  // certificate per SNI and some of them are self-signed, so a chain check
  // fails on a connection that is perfectly good. Skipping verification instead
  // would leave the tunnel open to anyone on the path, so the leaf's public key
  // is pinned and the chain is what gets skipped.
  //
  // Left empty, the known Cloudflare keys are used. Note this pins the public
  // key, not the certificate, so it survives the edge renewing a certificate for
  // the same key; streamSettings' own pinnedPeerCertSha256 hashes the whole
  // certificate and does not.
  repeated string pinned_peer_public_key_sha256 = 12;

  // How often the HTTP/2 carrier sends a PING, in seconds, and how long it
  // waits for the answer before giving the tunnel up.
  //
  // HTTP/3 does not read these: QUIC has a keepalive of its own, configured
  // like every other QUIC outbound's through streamSettings' quicSettings.
  // HTTP/2 has nothing equivalent, and without a ping it puts no bytes on the
  // wire at all while idle. That costs two things: a NAT may drop the mapping,
  // and -- the one that actually bites -- a connection the edge or a middlebox
  // has silently dropped is not noticed until the next write, which is some
  // user's connection failing rather than a reconnect.
  //
  // Zero takes the defaults, which are the reference client's: ping every 15s,
  // give up after 20s without an answer. A negative period turns the ping off.
  int32 keep_alive_period = 13;
  int32 keep_alive_timeout = 14;
}
