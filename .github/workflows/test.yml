name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

# Pinned: gofumpt adds rules between releases, and @latest would turn any such
# release into a spontaneous CI failure on unrelated PRs. Bump deliberately,
# together with GOFUMPT_VERSION in infra/mvlessgen/sync-mvless.sh, and re-run
# `go run ./infra/vformat/main.go -pwd ./`.
env:
  GOFUMPT_VERSION: v0.10.0

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              echo "missing=true" >> $GITHUB_OUTPUT
              break
            fi
          done
      - name: Sleep for 90 seconds if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        run: sleep 90

  check-proto:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Check Proto Version Header
        run: |
          head -n 4 core/config.pb.go > ref.txt
          find . -name "*.pb.go" ! -name "*_grpc.pb.go" -print0 | while IFS= read -r -d '' file; do
            if ! cmp -s ref.txt <(head -n 4 "$file"); then
              echo "Error: Header mismatch in $file"
              head -n 4 "$file"
              exit 1
            fi
          done

  check-format:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: |
          go install -v mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          go run ./infra/vformat/main.go -mode check -pwd ./

  check-mvless:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # core/config.pb.go's header is the single source of truth for the
      # protobuf toolchain this repo generates with.
      - name: Read protobuf toolchain versions
        id: pbver
        run: |
          echo "gen=$(sed -n '3s|.*protoc-gen-go v||p' core/config.pb.go | tr -d '[:cntrl:]')" >> $GITHUB_OUTPUT
          echo "protoc=$(sed -n '4s|.*protoc  *v5[.]||p' core/config.pb.go | tr -d '[:cntrl:]')" >> $GITHUB_OUTPUT
      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ steps.pbver.outputs.protoc }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v${{ steps.pbver.outputs.gen }}
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
      # MVLESS must stay a pure rename of VLESS plus the version byte.
      - name: Check MVLESS is in sync with VLESS
        run: bash infra/mvlessgen/verify-mvless.sh

  test:
    needs: check-assets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
          enableCrossOsArchive: true
      - name: Test
        run: go test -timeout 1h -v ./...
