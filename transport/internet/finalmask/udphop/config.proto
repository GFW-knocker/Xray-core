syntax = "proto3";

package xray.transport.internet.finalmask.udphop;
option csharp_namespace = "Xray.Transport.Internet.Finalmask.Udphop";
option go_package = "github.com/GFW-knocker/Xray-core/transport/internet/finalmask/udphop";
option java_package = "com.xray.transport.internet.finalmask.udphop";
option java_multiple_files = true;

message Config {
  reserved 1;
  bool local = 2;
  bool remote = 3;
  bool remote_once = 4;
  int64 interval_min = 5;
  int64 interval_max = 6;
  repeated string remoteIPs = 7;
  repeated uint32 remote_ports = 8;
  // packet_local sends from a fresh local port every packets_min..packets_max
  // datagrams, while still receiving on the earlier ports.
  bool packet_local = 9;
  int64 packets_min = 10;
  int64 packets_max = 11;
}

